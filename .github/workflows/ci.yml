name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: End-to-end smoke (promotion gate)
        run: bash scripts/smoke-e2e.sh

  docker-dev:
    # Every green build of main becomes the :dev image; promotion to :stable
    # is a separate manual step (admin panel button, M7).
    #
    # workflow_dispatch counts as well as push, because a push made with an app
    # credential (which is how agents commit here) triggers nothing at all — so
    # a merge can land on main with no run behind it. Running CI by hand from
    # the Actions tab used to verify main and then skip this job, leaving :dev
    # silently stale; now it publishes too.
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:dev
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

  docker-runner:
    # The sandbox image agent commands run inside. Published so a fresh host
    # pulls it instead of building locally. Independent of the app image.
    # Same trigger set as docker-dev, for the same reason.
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./runner
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-runner:latest
            ghcr.io/${{ github.repository }}-runner:sha-${{ github.sha }}

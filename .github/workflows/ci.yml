name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first one's answer irrelevant.
# Never cancel main, though: docker-dev hangs off it, and a cancelled run
# there leaves :dev stale with nothing saying so.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # The suites below are minutes; anything approaching this is wedged, and
    # without a cap a wedged job holds a runner for six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Typst backs the create_pdf tool and ships in the image. Without it here
      # the PDF suites skip themselves and the promotion gate would never once
      # compile a document. Version pinned to the Dockerfile's.
      - name: Install Typst, so the PDF tests actually run
        run: |
          curl -fsSL -o /tmp/typst.tar.xz \
            https://github.com/typst/typst/releases/download/v0.13.1/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo install -m 0755 /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: End-to-end smoke (promotion gate)
        run: bash scripts/smoke-e2e.sh

      # Only chromium, and only the browser: --with-deps would pull a desktop
      # stack we have no use for on a headless runner.
      - name: Install Chromium for the browser smoke
        run: npx playwright install chromium
      - name: Browser smoke (promotion gate)
        run: npm run test:ui

      # Screenshots are the whole point of a browser failure: a bounding-box
      # assertion tells you what moved, the picture tells you what it looks
      # like. Kept only when something failed.
      - name: Keep the screenshots from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  docker-dev:
    # Every green build of main becomes the :dev image; promotion to :stable
    # is a separate manual step (admin panel button, M7).
    #
    # workflow_dispatch counts as well as push, because a push made with an app
    # credential (which is how agents commit here) triggers nothing at all — so
    # a merge can land on main with no run behind it. Running CI by hand from
    # the Actions tab used to verify main and then skip this job, leaving :dev
    # silently stale; now it publishes too.
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:dev
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

  docker-runner:
    # The sandbox image agent commands run inside. Published so a fresh host
    # pulls it instead of building locally. Independent of the app image.
    # Same trigger set as docker-dev, for the same reason.
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./runner
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-runner:latest
            ghcr.io/${{ github.repository }}-runner:sha-${{ github.sha }}

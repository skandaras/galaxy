# Galaxy — prod + dev instances behind an existing reverse proxy + Authelia.
# The proxy terminates auth and forwards Remote-User/Remote-Email/Remote-Groups;
# each instance only trusts those headers from TRUSTED_PROXY_IPS.
#
#   ai.example.com      → galaxy-prod (image :stable)
#   dev-ai.example.com  → galaxy-dev  (image :dev)
#
# Nothing is shared between the two instances — separate volumes, separate env.

services:
  galaxy-prod:
    image: ghcr.io/skandaras/galaxy:stable
    restart: unless-stopped
    environment:
      GALAXY_ENV: prod
      AUTH_MODE: authelia
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:?set to your reverse proxy IP/CIDR}
      ADMIN_GROUP: galaxy-admins
      # Without this, adapter-node's 512K default rejects attachment uploads
      # long before the app's own 5 MB / 25 MB limits apply.
      BODY_SIZE_LIMIT: 32M
      CODING_EXECUTOR: docker
      DOCKER_API_URL: http://docker-socket-proxy:2375
      RUNNER_IMAGE: ghcr.io/skandaras/galaxy-runner:latest
      DATA_VOLUME: galaxy_galaxy-prod-data
      RUNNER_NETWORK: galaxy_runners
    volumes:
      - galaxy-prod-data:/data
    networks: [proxy, docker-api, searxng]

  galaxy-dev:
    image: ghcr.io/skandaras/galaxy:dev
    restart: unless-stopped
    environment:
      GALAXY_ENV: dev
      AUTH_MODE: authelia
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:?set to your reverse proxy IP/CIDR}
      ADMIN_GROUP: galaxy-admins
      BODY_SIZE_LIMIT: 32M
      # Coding sessions run each command in a throwaway runner container.
      CODING_EXECUTOR: docker
      DOCKER_API_URL: http://docker-socket-proxy:2375
      RUNNER_IMAGE: ghcr.io/skandaras/galaxy-runner:latest
      DATA_VOLUME: galaxy_galaxy-dev-data
      RUNNER_NETWORK: galaxy_runners
    volumes:
      - galaxy-dev-data:/data
    networks: [proxy, docker-api, searxng]

  # Self-hosted metasearch, the recommended web-search backend: no API key, no
  # quota, and (unlike DuckDuckGo's endpoint) it will not block the droplet for
  # being a datacenter IP. Not published through the reverse proxy — only the
  # galaxy containers reach it, over an internal network.
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      # Generate once with: openssl rand -hex 32
      SEARXNG_SECRET: "${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks: [searxng]

  # Restricted Docker API for spawning ephemeral coding runners (used from M3).
  # Grants container lifecycle only — no host filesystem, no exec into others.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 0
      EXEC: 0
      INFO: 0
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      ALLOW_DELETE: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]

volumes:
  galaxy-prod-data:
  galaxy-dev-data:

networks:
  proxy:
    external: true # join your existing reverse-proxy network
  # Only the galaxy app talks to the Docker API. The socket proxy lives here
  # and this network is internal, so nothing outside it can reach the Docker
  # API — runner containers are NOT attached, and therefore can never spawn
  # or control containers. That separation is the sandbox boundary.
  docker-api:
    internal: true
  # Galaxy ↔ SearXNG.
  #
  # Deliberately NOT `internal: true`, for the same reason as `runners` below:
  # a metasearch engine's whole job is outbound requests, and an internal
  # network has no gateway. SearXNG could therefore reach no engine at all and
  # answered every query with HTTP 200 and an empty result set — which read
  # downstream as "the web has nothing on this".
  #
  # Dropping it makes nothing reachable from outside: the service publishes no
  # ports, and that is what keeps it private. Isolation comes from not
  # publishing it, not from cutting its egress.
  searxng: {}
  # Ephemeral coding runners join this network (created at runtime via the
  # Docker API, so no compose service references it — see INSTALL.md §5:
  # it must be created once by hand).
  #
  # `name:` pins the real network name regardless of compose project name, so
  # it always matches RUNNER_NETWORK above; without it Docker 404s on start.
  #
  # Deliberately NOT `internal: true`: git clone/push and dependency installs
  # (npm/pip) run inside runners, so they need outbound access. Isolation from
  # the Docker API comes from docker-api above, not from cutting egress.
  runners:
    name: galaxy_runners
